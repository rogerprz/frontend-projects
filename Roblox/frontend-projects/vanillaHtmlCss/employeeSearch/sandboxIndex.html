<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandbox employee search</title>
</head>

<body>
  <script src="./sandboxEmpSearch.js"></script>
  <link rel="stylesheet" href="./employeeSearch.css">

  <div id="app">
    <h1>Employee directory</h1>
    <section class="search-container">
      <input type="text" id="search-input" placeholder="Search employeeSearch" />
      <button>Search</button>
      <button>Reset</button>
    </section>
    <section>
      <table id="employee-table">
        <thead>
          <tr>
            <th data-key="id">ID</th>
            <th data-key="name">Name</th>
            <th data-key="department">Department</th>
            <th data-key="age">Age</th>
          </tr>
        <tbody id="employee-table-body">

        </tbody>
        </thead>
      </table>
    </section>
  </div>

</body>
